<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="lime-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#dbfc49" />
            <stop offset="100%" stop-color="#99cc00" />
        </linearGradient>

        <clipPath id="sign-clip">
            <circle cx="256" cy="256" r="178" />
        </clipPath>

        <filter id="short-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000000"
                flood-opacity="0.35" />
        </filter>
    </defs>

    <circle cx="256" cy="256" r="256" fill="url(#lime-bg)" />

    <g transform="translate(275, 245) scale(2)">

        <path d="M 0 0 L 0 35 Q 0 50 15 50 L 65 50" fill="none" stroke="#000000" stroke-width="18"
            stroke-linecap="round" />

        <rect x="57" y="15" width="18" height="60" rx="6" fill="#000000" />

        <circle cx="0" cy="0" r="14" fill="none" stroke="#000000" stroke-width="12" />

        <g transform="rotate(-25)">

            <rect x="-85" y="-55" width="130" height="52" rx="6" fill="#000000" />

            <polygon points="-105,-68 35,-68 30,-48 -90,-48" fill="#000000" stroke="#000000"
                stroke-width="8" stroke-linejoin="round" />

            <rect x="-90" y="-45" width="10" height="32" rx="3" fill="#000000" />

            <rect x="-12" y="-15" width="24" height="20" fill="#000000" />

            <rect x="22" y="-12" width="20" height="18" rx="5" fill="#000000" />

        </g>
    </g>

    <g filter="url(#short-shadow)">
        <circle cx="256" cy="256" r="150" fill="none" stroke="#e62e2e" stroke-width="32" />
        <line x1="140" y1="140" x2="372" y2="372" stroke="#e62e2e" stroke-width="32"
            clip-path="url(#sign-clip)" />
    </g>
</svg>
